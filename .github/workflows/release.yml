name: Publish NBU-OS release

on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools gdisk dosfstools qemu-system-x86 file

      - name: Build NBU-OS
        working-directory: NBU-OS
        run: |
          chmod +x scripts/build.sh scripts/check_iso.sh
          make clean all
          ./scripts/build.sh

      - name: Validate Multiboot2 kernel
        working-directory: NBU-OS
        run: grub-file --is-x86-multiboot2 build/nbu-kernel.elf

      - name: Verify release files
        working-directory: NBU-OS
        run: |
          test -f dist/NBU-OS.iso
          test -f dist/NBU-OS.img
          file dist/NBU-OS.iso dist/NBU-OS.img
          sha256sum dist/NBU-OS.iso dist/NBU-OS.img

      - name: Create UTM bundle
        working-directory: NBU-OS
        run: |
          if [ -x scripts/create-utm.sh ]; then
            ./scripts/create-utm.sh
            cd dist
            zip -qr NBU-OS-UTM.zip NBU-OS.utm
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NBU-OS ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            NBU-OS/dist/NBU-OS.iso
            NBU-OS/dist/NBU-OS.img
            NBU-OS/dist/NBU-OS-UTM.zip
