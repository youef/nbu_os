name: Build NBU-OS GUI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools gdisk dosfstools qemu-system-x86 file
      - name: Set release version
        run: printf '0.4.0-alpha1\n' > NBU-OS/VERSION
      - name: Build kernel
        working-directory: NBU-OS
        run: make clean all
      - name: Build ISO and IMG
        working-directory: NBU-OS
        run: ./scripts/build.sh
      - name: Validate Multiboot2 kernel
        working-directory: NBU-OS
        run: grub-file --is-x86-multiboot2 build/nbu-kernel.elf
      - name: Upload GUI ISO
        uses: actions/upload-artifact@v4
        with:
          name: NBU-OS-GUI-ISO
          path: NBU-OS/dist/NBU-OS.iso
      - name: Upload GUI IMG
        uses: actions/upload-artifact@v4
        with:
          name: NBU-OS-GUI-IMG
          path: NBU-OS/dist/NBU-OS.img
