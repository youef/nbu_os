name: Build NBU-OS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils grub-pc-bin grub-common xorriso
      - name: Generate project
        run: ./build_nbu.sh
      - name: Build ISO
        working-directory: NBU-OS
        run: ./scripts/build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NBU-OS-ISO
          path: NBU-OS/dist/NBU-OS.iso
